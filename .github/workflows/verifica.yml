# Sintaxis ESM de todo el JS antes de publicar. Evita que un string roto
# llegue a producción: `node --check` solo (CommonJS) da falsos OK.
name: Verificar JS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sintaxis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chequeo de sintaxis ESM
        run: node scripts/verifica-js.mjs .
